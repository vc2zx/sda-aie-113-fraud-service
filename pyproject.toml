[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud scoring service"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic>=2",
    "fastapi[standard]",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_service"]

[project.optional-dependencies]
dev = [
    "ruff",
    "httpx",
]