name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"

      - run: >
          pytest
          --cov=fraud_service.domain
          --cov=fraud_service.service
          --cov=fraud_service.api
          --cov-branch
          --cov-fail-under=80
          -q

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-service:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name fraud-api -p 8000:8000 fraud-service:${{ github.sha }}

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/v1/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs fraud-api
          exit 1

      - name: Prediction smoke test
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payloads/sample.json \
            http://127.0.0.1:8000/v1/predict

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, image-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vc2zx/sda-aie-113-fraud-service:${{ github.sha }}
